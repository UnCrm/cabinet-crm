<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Covers entire canvas for maskable requirement -->
    <radialGradient id="maskBgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="maskRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Plus Accent Gradient -->
    <linearGradient id="maskPlusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#maskBgGrad)" />

  <!-- Center Safe Zone Circular Visual (80% safe zone) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Circular Badge Border -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#maskRingGrad)" stroke-width="12" />
    <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3" />

    <!-- "CRM" in bold display font -->
    <text x="210" y="258" 
          text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="126" 
          letter-spacing="2"
          fill="#ffffff">CRM</text>
    
    <!-- "+" badge in emerald green -->
    <text x="350" y="240" 
          text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="url(#maskPlusGrad)">+</text>

    <!-- Capsule label -->
    <rect x="166" y="340" width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.2" />
    <text x="256" y="358" 
          text-anchor="middle" 
          dominant-baseline="central"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="16" 
          letter-spacing="4" 
          fill="#93c5fd">PRO COURTAGE</text>
  </g>
</svg>
